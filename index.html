<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>작곡가 탐구 교실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#26324a; --ink-soft:#4b566b; --line:#d3d9e4; --danger:#a3263a;
  --bg:#eef0f8; --accent:#3d4a8a; --accent-soft:#dfe3f5;
}
body.theme-6{ --bg:#e4f2fb; --accent:#1d5a86; --accent-soft:#cde5f5; }
body.theme-7{ --bg:#fce8ef; --accent:#9c3560; --accent-soft:#f5d2df; }
body.theme-8{ --bg:#fff5d3; --accent:#7a5600; --accent-soft:#f6e4a6; }
body.theme-teacher{ --bg:#f2f4f8; --accent:#2d4670; --accent-soft:#dde4f0; }

*{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; }
body{
  margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
  font-family:'Nanum Gothic', sans-serif; font-weight:400; font-size:19px; line-height:1.75;
  transition:background .3s;
}
h1,h2,h3{ font-weight:800; line-height:1.4; margin:0 0 .6em; }
h2{ font-size:1.35em; } h3{ font-size:1.12em; }
p{ margin:.4em 0 .8em; }
b,strong{ font-weight:800; }
button,input,textarea,select{ font-family:inherit; font-size:18px; color:var(--ink); }
.hidden{ display:none !important; }

/* 버튼 */
.btn{
  min-height:52px; padding:10px 22px; border-radius:14px; border:2px solid var(--accent);
  background:var(--accent); color:#fff; font-weight:700; cursor:pointer; touch-action:manipulation;
}
.btn.sub{ background:#fff; color:var(--accent); }
.btn.danger{ background:#fff; color:var(--danger); border-color:var(--danger); }
.btn.small{ min-height:44px; padding:6px 14px; font-size:16px; }
.btn:disabled{ opacity:.45; cursor:not-allowed; }
.btn-row{ display:flex; flex-wrap:wrap; gap:10px; margin-top:16px; }
.linkbtn{ background:none; border:none; color:var(--ink-soft); text-decoration:underline; cursor:pointer; padding:10px; min-height:44px; }

/* 입력 */
input[type=text],input[type=password],textarea,select{
  width:100%; padding:12px 14px; border:2px solid var(--line); border-radius:12px; background:#fff; line-height:1.6;
  -webkit-appearance:none; appearance:none;
}
select{ background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);
  background-position:calc(100% - 22px) 50%,calc(100% - 16px) 50%; background-size:6px 6px; background-repeat:no-repeat; padding-right:40px; }
input:focus,textarea:focus,select:focus{ outline:none; border-color:var(--accent); }
textarea{ min-height:120px; resize:vertical; }
label{ display:block; font-weight:700; margin:16px 0 6px; }
.hint{ color:var(--ink-soft); font-size:.9em; }
.err{ color:var(--danger); font-weight:700; min-height:1.5em; margin-top:8px; }

/* 상단 */
#topbar{
  position:sticky; top:0; z-index:20; background:rgba(255,255,255,.94);
  border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px;
  padding:8px 16px; padding-top:calc(8px + env(safe-area-inset-top));
}
#topbar .title{ font-weight:800; font-size:20px; }
#topbar .who{ margin-left:auto; display:flex; align-items:center; gap:10px; font-size:16px; color:var(--ink-soft); }
.tabs{ display:flex; gap:8px; order:3; width:100%; }
@media (min-width:900px){ .tabs{ order:0; width:auto; margin-left:16px; } }
.tab{ flex:1; min-height:50px; padding:6px 18px; border-radius:12px; border:2px solid transparent; font-weight:800; cursor:pointer; color:var(--ink); }
.tab[data-t="6"]{ background:#e4f2fb; } .tab[data-t="6"].on{ background:#1d5a86; color:#fff; }
.tab[data-t="7"]{ background:#fce8ef; } .tab[data-t="7"].on{ background:#9c3560; color:#fff; }
.tab[data-t="8"]{ background:#fff5d3; } .tab[data-t="8"].on{ background:#7a5600; color:#fff; }
.tab.t-tch{ background:#eef1f6; } .tab.t-tch.on{ background:#2d4670; color:#fff; }

main{ max-width:1180px; margin:0 auto; padding:18px 16px calc(40px + env(safe-area-inset-bottom)); }
.card{ background:#fff; border-radius:18px; padding:22px; box-shadow:0 2px 10px rgba(38,50,74,.07); margin-bottom:18px; }
.card.narrow{ max-width:520px; margin:40px auto; }
.banner{ background:var(--accent-soft); border-radius:14px; padding:12px 16px; margin-bottom:14px; }

/* 단계 표시줄 */
.steps{ display:flex; flex-wrap:wrap; gap:8px; list-style:none; padding:0; margin:0 0 18px; }
.steps li{
  flex:1 1 150px; display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:14px;
  background:#fff; border:2px solid var(--line); color:var(--ink-soft); font-weight:700; font-size:17px; line-height:1.4;
}
.steps li .no{ display:inline-flex; width:32px; height:32px; border-radius:50%; align-items:center; justify-content:center; background:var(--line); color:var(--ink); flex:none; font-weight:800; }
.steps li.done{ background:var(--accent-soft); border-color:var(--accent-soft); color:var(--ink); cursor:pointer; }
.steps li.done .no{ background:var(--accent); color:#fff; }
.steps li.now{ background:var(--accent); border-color:var(--accent); color:#fff; }
.steps li.now .no{ background:#fff; color:var(--accent); }

/* 대화 */
.chat{
  display:flex; flex-direction:column; gap:12px; overflow-y:auto; -webkit-overflow-scrolling:touch;
  background:var(--accent-soft); border-radius:16px; padding:14px; height:min(56vh,620px);
}
.chat.side{ height:min(68vh,760px); }
.msg{ max-width:84%; padding:12px 16px; border-radius:18px; overflow-wrap:anywhere; word-break:keep-all; }
.msg .who{ display:block; font-size:14px; font-weight:700; opacity:.85; margin-bottom:2px; }
.msg .at{ display:block; font-size:13px; opacity:.7; margin-top:4px; }
.msg.me{ align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:6px; }
.msg.bot{ align-self:flex-start; background:#fff; border:1px solid var(--line); border-bottom-left-radius:6px; }
.msg.note{ align-self:center; background:#fff3f3; color:var(--danger); border:1px solid #f0c4ca; font-weight:700; max-width:94%; }
.msg.thinking .dots::after{ content:''; animation:dots 1.4s infinite; }
@keyframes dots{ 0%{content:'';} 25%{content:'.';} 50%{content:'..';} 75%{content:'...';} }
.composer{ display:flex; gap:10px; margin-top:12px; align-items:flex-end; }
.composer textarea{ min-height:58px; height:58px; flex:1; }
.composer .btn{ flex:none; }

/* 나란히 보기 */
.split{ display:grid; grid-template-columns:1fr; gap:18px; }
@media (min-width:900px){ .split{ grid-template-columns:1fr 1fr; } }
.kwbox{ border:2px solid var(--accent-soft); border-radius:14px; padding:4px 16px 16px; margin-bottom:12px; }
.summary dt{ font-weight:800; margin-top:8px; } .summary dd{ margin:0 0 4px; }
.preview{ max-width:100%; max-height:420px; border-radius:12px; border:1px solid var(--line); display:block; margin-top:10px; }
details summary{ cursor:pointer; font-weight:800; min-height:44px; display:flex; align-items:center; }

/* 8차시 목록 */
.plist{ display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px; }
.pbtn{ min-height:70px; text-align:left; padding:12px 16px; border-radius:14px; border:2px solid var(--line); background:#fff; cursor:pointer; font-weight:700; line-height:1.4; }
.pbtn .s{ display:block; font-size:15px; color:var(--ink-soft); font-weight:400; }
.pbtn.wrote{ border-color:var(--accent); background:var(--accent-soft); }

/* 교사 화면 */
table{ width:100%; border-collapse:collapse; font-size:16px; background:#fff; }
th,td{ border-bottom:1px solid var(--line); padding:10px 8px; text-align:left; vertical-align:top; }
th{ background:#eef1f6; font-weight:800; white-space:nowrap; }
tr.click{ cursor:pointer; } tr.click:hover{ background:#f7f9fc; }
.tablewrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
.chip{ display:inline-block; padding:2px 10px; border-radius:999px; font-size:14px; font-weight:700; background:#eef1f6; white-space:nowrap; }
.chip.ok{ background:#d9efe1; color:#1f5b35; }
.tch-toolbar{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:16px; }
.tch-toolbar select{ width:auto; min-width:140px; }
.fbgroup h3{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.pre{ white-space:pre-wrap; background:#f7f8fb; border-radius:10px; padding:12px; }
input[type=checkbox]{ width:26px; height:26px; accent-color:var(--accent); }
.bigimg{ max-width:100%; width:800px; border-radius:12px; border:1px solid var(--line); }

/* 창 */
.modal{ position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(20,28,44,.45); z-index:50; display:flex; align-items:center; justify-content:center; padding:20px; }
.modal .box{ background:#fff; border-radius:20px; padding:26px; max-width:480px; width:100%; }
#toast{ position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:var(--ink); color:#fff; padding:12px 22px; border-radius:999px; z-index:60; opacity:0; transition:opacity .3s; pointer-events:none; font-weight:700; }
#toast.show{ opacity:1; }

/* 인쇄 */
#printArea{ display:none; }
@media print{
  body.printing > *:not(#printArea){ display:none !important; }
  body.printing{ background:#fff; }
  body.printing #printArea{ display:block !important; font-size:12pt; line-height:1.6; color:#000; }
  .pp{ break-after:page; page-break-after:always; }
  .pp:last-child{ break-after:auto; page-break-after:auto; }
  .pp h1{ font-size:18pt; margin-bottom:4pt; }
  .pp .pitem{ border:1px solid #999; border-radius:6pt; padding:8pt 10pt; margin:8pt 0; break-inside:avoid; page-break-inside:avoid; }
}
</style>
</head>
<body class="theme-login">

<header id="topbar">
  <span class="title">🎼 작곡가 탐구 교실</span>
  <nav class="tabs hidden" id="tabs"></nav>
  <span class="who" id="who"></span>
</header>
<main id="app"></main>

<div id="modal" class="modal hidden"><div class="box" id="modalBox"></div></div>
<div id="toast"></div>
<div id="printArea"></div>

<script>
/* =================================================================
   ★★★ 【여기를 바꾸세요 1】 앱스스크립트 웹앱 배포 주소 ★★★
   작은따옴표(' ') 안에 'https://script.google.com/macros/s/.../exec' 주소를 붙여 넣으세요.
   ================================================================= */
const API_URL = '여기에_웹앱_주소를_붙여_넣으세요';

/* ★ 【여기를 바꾸세요 2 - 선택】 패들렛 주소 (비워 두면 안내 문구만 보여요) */
const PADLET_URL = '';
/* ================================================================= */

const S = { token:null, sid:'', cls:'', tab:6, st:null, step6:1, step7:1, step8:1, busy:false, img:null, presenters:[], pick:null };
const T = { token:null, view:'students', cls:'', classes:[], students:[], detail:null, fb:[] };
const app = document.getElementById('app');

/* ---------- 공통 도우미 ---------- */
function h(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtMsg(s){
  let t = h(s);
  t = t.replace(/^\s*#{1,6}\s*/gm,'');
  t = t.replace(/^\s*[\*\-]\s+/gm,'• ');
  t = t.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  return t.replace(/\n/g,'<br>');
}
function $(id){ return document.getElementById(id); }
function val(id){ const el=$(id); return el ? el.value.trim() : ''; }
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2200); }
function ss(k,v){ try{ if(v===undefined) return JSON.parse(sessionStorage.getItem(k)||'null'); if(v===null) sessionStorage.removeItem(k); else sessionStorage.setItem(k,JSON.stringify(v)); }catch(e){ return null; } }

function modal(html, buttons){
  $('modalBox').innerHTML = html + '<div class="btn-row" id="modalBtns"></div>';
  const row = $('modalBtns');
  buttons.forEach(b=>{
    const el=document.createElement('button');
    el.className='btn '+(b.cls||''); el.textContent=b.label;
    el.onclick=()=>{ closeModal(); if(b.onClick) b.onClick(); };
    row.appendChild(el);
  });
  $('modal').classList.remove('hidden');
}
function closeModal(){ $('modal').classList.add('hidden'); }

async function api(action, data, token){
  if(API_URL.indexOf('script.google.com') < 0) throw { code:'SETUP', message:'앱 주소가 아직 설정되지 않았어요. 선생님께 알려 줘.' };
  const body = JSON.stringify(Object.assign({ action:action, token: token || S.token }, data||{}));
  let res;
  const ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  const timer = ctrl ? setTimeout(()=>ctrl.abort(), 90000) : null;
  try{
    res = await fetch(API_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body:body, redirect:'follow', signal: ctrl ? ctrl.signal : undefined });
  }catch(e){
    throw { code:'NETWORK', message:'인터넷 연결이 불안정해요. 연결을 확인하고 다시 해 줘.' };
  }finally{ if(timer) clearTimeout(timer); }
  let j;
  try{ j = await res.json(); }catch(e){ throw { code:'SERVER', message:'서버 응답을 읽지 못했어요. 잠시 뒤 다시 해 줘.' }; }
  if(!j.ok){
    if(j.code === 'AUTH') setTimeout(()=>authLost(j.message), 50);
    throw { code:j.code, message:j.message };
  }
  return j.data;
}
function errMsg(e){ return (e && e.message) ? e.message : '문제가 생겼어요. 다시 해 줘.'; }

function authLost(msg){
  if(T.token){ T.token=null; ss('tch',null); renderTeacherLogin(msg); }
  else { S.token=null; ss('stu',null); renderLogin(msg); }
}

function setTheme(name){ document.body.className = 'theme-'+name; }

function stepsHtml(labels, cur, doneFlags, onclickName){
  return '<ol class="steps">' + labels.map((l,i)=>{
    const n=i+1; const cls = n===cur ? 'now' : (doneFlags[i] ? 'done' : '');
    const click = (n!==cur && doneFlags[i]) ? ` onclick="${onclickName}(${n})"` : '';
    return `<li class="${cls}"${click}><span class="no">${doneFlags[i] && n!==cur ? '✓' : n}</span>${h(l)}</li>`;
  }).join('') + '</ol>';
}

function bubbles(list, opt){
  opt = opt||{};
  return list.map(m=>{
    const me = m.who === '학생';
    return `<div class="msg ${me?'me':'bot'}"><span class="who">${me?(opt.meLabel||'나'):'챗봇'}</span>${fmtMsg(m.text)}${opt.time&&m.at?`<span class="at">${h(m.at)}</span>`:''}</div>`;
  }).join('');
}
function scrollChat(id){ const c=$(id); if(c) c.scrollTop=c.scrollHeight; }

/* =================================================================
   학생: 입장
   ================================================================= */
function renderLogin(msg){
  setTheme('login');
  $('tabs').classList.add('hidden'); $('who').innerHTML='';
  app.innerHTML = `
  <div class="card narrow">
    <h2>반가워! 학번을 써 줘</h2>
    <p class="hint">예: 1학년 3반 5번 → 10305</p>
    <input type="text" id="sid" inputmode="numeric" pattern="[0-9]*" maxlength="5" autocomplete="off" placeholder="학번 5자리">
    <div class="err" id="err">${h(msg||'')}</div>
    <div class="btn-row"><button class="btn" id="goSid" onclick="checkSid()">다음</button></div>
    <div style="text-align:right;margin-top:10px"><button class="linkbtn" onclick="renderTeacherLogin()">선생님 화면</button></div>
  </div>`;
  $('sid').focus();
}

async function checkSid(){
  const sid = val('sid');
  if(!/^\d{5}$/.test(sid)){ $('err').textContent='학번은 숫자 5자리로 써 줘.'; return; }
  $('goSid').disabled = true; $('err').textContent='확인하는 중...';
  try{
    const r = await api('checkStudent',{ sid:sid });
    renderPin(sid, r.status);
  }catch(e){ $('err').textContent = errMsg(e); $('goSid').disabled=false; }
}

function renderPin(sid, status){
  const isSet = status !== 'normal';
  const title = status==='new' ? '처음 왔구나! PIN을 정해 줘' : status==='reset' ? '새 PIN을 정해 줘' : 'PIN을 써 줘';
  const desc = status==='new' ? '앞으로 들어올 때 쓸 숫자 4자리야. 잊지 않게 꼭 기억해 둬.'
             : status==='reset' ? '선생님이 PIN을 초기화했어. 새 숫자 4자리를 정해 줘.'
             : '처음에 정한 숫자 4자리를 써 줘.';
  app.innerHTML = `
  <div class="card narrow">
    <h2>${title}</h2>
    <p>학번 <b>${h(sid)}</b></p>
    <p class="hint">${desc}</p>
    <label for="pin1">PIN 4자리</label>
    <input type="password" id="pin1" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off">
    ${isSet ? `<label for="pin2">한 번 더 써 줘</label><input type="password" id="pin2" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off">` : ''}
    <div class="err" id="err"></div>
    <div class="btn-row">
      <button class="btn" id="goPin" onclick="doLogin('${sid}', ${isSet})">들어가기</button>
      <button class="btn sub" onclick="renderLogin()">학번 다시 쓰기</button>
    </div>
  </div>`;
  $('pin1').focus();
}

async function doLogin(sid, isSet){
  const p1 = val('pin1');
  if(!/^\d{4}$/.test(p1)){ $('err').textContent='PIN은 숫자 4자리로 써 줘.'; return; }
  if(isSet && p1 !== val('pin2')){ $('err').textContent='두 번 쓴 PIN이 달라. 다시 확인해 줘.'; return; }
  $('goPin').disabled = true; $('err').textContent='들어가는 중...';
  try{
    const r = await api('studentLogin',{ sid:sid, pin:p1, mode: isSet ? 'set' : 'enter' });
    S.token=r.token; S.sid=r.sid; S.cls=r.cls; S.tab=6;
    ss('stu',{ token:S.token, sid:S.sid, cls:S.cls, tab:6 });
    await loadStudent();
  }catch(e){ $('err').textContent = errMsg(e); $('goPin').disabled=false; }
}

function studentLogout(){
  modal('<h3>나갈까?</h3><p>지금까지 한 활동은 저장되어 있어. 다음에 학번과 PIN으로 이어서 할 수 있어.</p>',
    [{label:'나가기', onClick:()=>{ S.token=null; ss('stu',null); renderLogin(); }},{label:'취소', cls:'sub'}]);
}

async function loadStudent(){
  app.innerHTML = '<div class="card narrow"><p>불러오는 중...</p></div>';
  try{
    S.st = await api('getState');
    decideSteps();
    renderStudent();
  }catch(e){
    if(e.code!=='AUTH') app.innerHTML = `<div class="card narrow"><p class="err">${h(errMsg(e))}</p><button class="btn" onclick="loadStudent()">다시 시도</button></div>`;
  }
}

function decideSteps(){
  const st=S.st;
  S.step6 = !st.composer ? 1 : (!st.keywords ? 2 : 3);
  if(!st.keywords) S.step7 = 1;
  else if(!st.cartoon) S.step7 = 1;
  else if(st.cartoon.memo && st.cartoon.memo.at) S.step7 = 4;
  else S.step7 = 2;
  S.step8 = 1;
}

function renderStudent(){
  const tabs=$('tabs');
  tabs.classList.remove('hidden');
  tabs.innerHTML = [6,7,8].map(n=>`<button class="tab ${S.tab===n?'on':''}" data-t="${n}" onclick="setTab(${n})">${n}차시</button>`).join('');
  $('who').innerHTML = `학번 ${h(S.sid)} <button class="btn sub small" onclick="studentLogout()">나가기</button>`;
  setTheme(String(S.tab));
  if(S.tab===6) render6(); else if(S.tab===7) render7(); else render8();
  window.scrollTo(0,0);
}
function setTab(n){
  if(S.busy){ toast('챗봇 답을 기다리는 중이야. 잠깐만!'); return; }
  S.tab=n; const s=ss('stu'); if(s){ s.tab=n; ss('stu',s); }
  renderStudent();
}

/* =================================================================
   6차시: 작곡가 탐구 챗봇
   ================================================================= */
function asked6(){ return S.st.chat6.some(m=>m.who==='학생'); }
function go6(n){ if(S.busy) return; S.step6=n; renderStudent(); }

function render6(){
  const st=S.st;
  const done=[!!st.composer, !!st.keywords || (asked6() && S.step6===3), !!st.keywords];
  let html = stepsHtml(['작곡가·곡 정하기','챗봇과 탐구','키워드 정하기'], S.step6, done, 'go6');

function resizeImage(file, maxSide, quality){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      let w=img.naturalWidth, hh=img.naturalHeight;
      const s=Math.min(1, maxSide/Math.max(w,hh));
      w=Math.round(w*s); hh=Math.round(hh*s);
      const cv=document.createElement('canvas'); cv.width=w; cv.height=hh;
      const ctx=cv.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,hh); ctx.drawImage(img,0,0,w,hh);
      URL.revokeObjectURL(url);
      resolve(cv.toDataURL('image/jpeg', quality));
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error('decode')); };
    img.src=url;
  });
}

async function pickImage(input){
  const f=input.files && input.files[0];
  if(!f) return;
  const info=$('imgInfo');
  if(f.size > 25*1024*1024){ info.textContent='사진이 너무 커. 다른 사진을 골라 줘.'; input.value=''; return; }
  info.textContent='사진 크기를 줄이는 중...';
  try{
    S.img = await resizeImage(f, 1280, 0.85);
    const p=$('prev'); p.src=S.img; p.classList.remove('hidden');
    info.textContent='준비됐어!';
  }catch(e){
    S.img=null; input.value='';
    info.textContent='이 사진은 열 수 없어. JPG나 PNG로 저장해서 다시 골라 줘.';
  }
}

async function call7(data, pendingText){
  S.busy=true;

  const chat=$('chat7');
  if(pendingText) chat.insertAdjacentHTML('beforeend', `<div class="msg me" id="pendingMe"><span class="who">나</span>${fmtMsg(pendingText)}</div>`);
  chat.insertAdjacentHTML('beforeend', `<div class="msg bot thinking" id="thinking"><span class="who">챗봇</span>생각하는 중<span class="dots"></span></div>`);
  scrollChat('chat7');
  try{
    const r = await api('chat7', data);
    S.st.cartoon.dialog = r.dialog;
    if($('chat7')) $('chat7').innerHTML = bubbles(r.dialog);
  }catch(e){
    const pm=$('pendingMe'); if(pm) pm.remove();
    const th=$('thinking'); if(th) th.remove();
    if(e.code!=='AUTH' && $('chat7')){
      const retry = data.start ? ' <button class="btn small" onclick="this.parentNode.remove();start7()">다시 시도</button>' : '';

      if(pendingText && $('q7')) $('q7').value=pendingText;
    }
  }finally{
    S.busy=false;
    ['send7','end7'].forEach(id=>{ if($(id)) $(id).disabled=false; });
    scrollChat('chat7');
  }
}

  }

function pick8(i){ S.pick=S.presenters[i]; S.step8=2; render8(); }

async function saveFb(){
  const feel=val('fe'), question=val('qu');
  if(!feel||!question){ $('err').textContent='느낀 점과 질문을 모두 써 줘.'; return; }
  $('saveF').disabled=true; $('err').textContent='저장하는 중...';
  try{
    await api('saveFeedback',{ presenter:S.pick.sid, feel:feel, question:question });
    toast('저장했어!');
    go8(1);
  }catch(e){ $('err').textContent=errMsg(e); $('saveF').disabled=false; }
}

/* =================================================================
   교사 화면
   ================================================================= */
function renderTeacherLogin(msg){
  setTheme('teacher');
  $('tabs').classList.add('hidden'); $('who').innerHTML='';
  app.innerHTML = `<div class="card narrow"><h2>선생님 화면</h2>
    <label for="tpw">교사 비밀번호</label><input type="password" id="tpw" autocomplete="off">
    <div class="err" id="err">${h(msg||'')}</div>
    <div class="btn-row"><button class="btn" id="goT" onclick="teacherLogin()">들어가기</button>
      <button class="btn sub" onclick="renderLogin()">학생 화면으로</button></div></div>`;
  $('tpw').focus();
}

async function teacherLogin(){
  const pw=$('tpw').value;
  if(!pw){ $('err').textContent='비밀번호를 입력해 주세요.'; return; }
  $('goT').disabled=true; $('err').textContent='확인하는 중...';
  try{
    const r = await api('teacherLogin',{ pw:pw }, '-');
    T.token=r.token; ss('tch',{ token:T.token });
    await teacherHome();
  }catch(e){ $('err').textContent=errMsg(e); $('goT').disabled=false; }
}
function tapi(action,data){ return api(action,data,T.token); }

async function teacherHome(){
  setTheme('teacher');
  const tabs=$('tabs'); tabs.classList.remove('hidden');
  tabs.innerHTML = `<button class="tab t-tch ${T.view==='students'?'on':''}" onclick="tView('students')">학생 기록</button>
    <button class="tab t-tch ${T.view==='feedback'?'on':''}" onclick="tView('feedback')">발표 피드백</button>`;
  $('who').innerHTML = `선생님 <button class="btn sub small" onclick="teacherLogout()">나가기</button>`;
  app.innerHTML='<div class="card"><p>불러오는 중...</p></div>';
  try{
    T.classes = await tapi('tClasses');
    if(!T.cls && T.classes.length) T.cls=T.classes[0];
    await tLoad();
  }catch(e){ if(e.code!=='AUTH') app.innerHTML=`<div class="card"><p class="err">${h(errMsg(e))}</p><button class="btn" onclick="teacherHome()">다시 시도</button></div>`; }
}
function teacherLogout(){ T.token=null; ss('tch',null); renderLogin(); }
function tView(v){ T.view=v; T.detail=null; teacherHome(); }

function toolbar(){
  return `<div class="tch-toolbar"><label for="tcls" style="margin:0">반</label>
    <select id="tcls" onchange="T.cls=this.value;T.detail=null;tLoad()">
      ${T.classes.map(c=>`<option value="${h(c)}" ${c===T.cls?'selected':''}>${h(c.charAt(0))}학년 ${h(Number(c.slice(1)))}반 (${h(c)})</option>`).join('')}
    </select>
    <button class="btn sub small" onclick="tLoad()">새로고침</button></div>`;
}

async function tLoad(){
  if(!T.classes.length){ app.innerHTML='<div class="card"><p>아직 들어온 학생이 없어요.</p><button class="btn sub" onclick="teacherHome()">새로고침</button></div>'; return; }
  app.innerHTML = toolbar() + '<div id="tv"><div class="card"><p>불러오는 중...</p></div></div>';
  try{
    if(T.view==='students'){ T.students = await tapi('tStudents',{ cls:T.cls }); tStudentsView(); }
    else { T.fb = await tapi('tFeedback',{ cls:T.cls }); tFeedbackView(); }
  }catch(e){ if(e.code!=='AUTH') $('tv').innerHTML=`<div class="card"><p class="err">${h(errMsg(e))}</p></div>`; }
}

function chip(okText, v){ return v ? `<span class="chip ok">${okText}</span>` : '<span class="chip">-</span>'; }

function tStudentsView(){
  const L=T.students;
  $('tv').innerHTML = `<div class="card"><h2>${h(T.cls)} 학생 목록 (${L.length}명)</h2>
    <p class="hint">줄을 누르면 학생 기록을 볼 수 있어요.</p>
    <div class="tablewrap"><table><thead><tr><th>학번</th><th>작곡가</th><th>곡</th><th>질문 수</th><th>6차시</th><th>카툰</th><th>7차시</th><th>마지막 접속</th><th>PIN</th></tr></thead>
    <tbody>${L.map(s=>`<tr class="click" onclick="tOpen('${h(s.sid)}')">
      <td><b>${h(s.sid)}</b></td><td>${h(s.composer)}</td><td>${h(s.piece)}</td><td>${s.q6}</td>
      <td>${chip('완료',s.done6)}</td><td>${chip('올림',s.cartoon)}</td><td>${chip('완료',s.done7)}</td>
      <td>${h(s.last)}</td>
      <td onclick="event.stopPropagation()">${s.hasPin ? `<button class="btn danger small" onclick="tReset('${h(s.sid)}')">초기화</button>` : '<span class="chip">새로 정하는 중</span>'}</td>
    </tr>`).join('')}</tbody></table></div></div>`;
}

function tReset(sid){
  modal(`<h3>${h(sid)} 학생의 PIN을 초기화할까요?</h3><p>학생은 다음에 들어올 때 PIN을 새로 정해요. 활동 기록은 그대로 남아요.</p>`,
    [{label:'초기화', cls:'', onClick: async ()=>{
      try{ await tapi('tResetPin',{ sid:sid }); toast(sid+' PIN을 초기화했어요.'); tLoad(); }catch(e){ toast(errMsg(e)); }
    }},{label:'취소', cls:'sub'}]);
}

async function tOpen(sid){
  $('tv').innerHTML='<div class="card"><p>불러오는 중...</p></div>';
  try{ T.detail = await tapi('tDetail',{ sid:sid }); tDetailView(); window.scrollTo(0,0); }
  catch(e){ if(e.code!=='AUTH') $('tv').innerHTML=`<div class="card"><p class="err">${h(errMsg(e))}</p></div>`; }
}

function tDetailView(){
  const d=T.detail, c=d.cartoon;
  const kw = d.keywords ? `<table><thead><tr><th>키워드</th><th>고른 이유</th></tr></thead><tbody>${d.keywords.items.map(x=>`<tr><td><b>${h(x.kw)}</b></td><td>${h(x.reason)}</td></tr>`).join('')}</tbody></table><p class="hint">저장: ${h(d.keywords.at)}</p>` : '<p class="hint">아직 저장하지 않았어요.</p>';
  const s7 = c ? `
      <h3>카툰 이미지</h3>
      <a href="${h(c.imgLarge)}" target="_blank" rel="noopener"><img class="bigimg" src="${h(c.img)}" alt="카툰"></a>
      <p class="hint">이미지를 누르면 새 창에서 크게 보여요. 제출: ${h(c.at)} · <a href="${h(c.link)}" target="_blank" rel="noopener">드라이브에서 열기</a></p>
      <h3>이미지 AI 프롬프트</h3><div class="pre">${h(c.prompt)}</div>
      <h3 style="margin-top:16px">장면 설명</h3><div class="pre">${h(c.scene)}</div>
      <h3 style="margin-top:16px">점검 대화</h3>
      ${c.dialog.length ? `<div class="chat side">${bubbles(c.dialog,{meLabel:'학생',time:true})}</div>` : '<p class="hint">아직 대화하지 않았어요.</p>'}
      <h3 style="margin-top:16px">발표 준비 메모</h3>
      ${c.memo.at ? `<table><tbody>
        <tr><th>가장 인상적인 장면</th><td>${h(c.memo.m1)}</td></tr>
        <tr><th>키워드를 이렇게 정한 이유</th><td>${h(c.memo.m2)}</td></tr>
        <tr><th>장면에 담은 의도</th><td>${h(c.memo.m3)}</td></tr></tbody></table><p class="hint">저장: ${h(c.memo.at)}</p>` : '<p class="hint">아직 저장하지 않았어요.</p>'}`
    : '<p class="hint">아직 카툰을 올리지 않았어요.</p>';
  $('tv').innerHTML = `<div class="btn-row" style="margin:0 0 14px"><button class="btn sub" onclick="T.detail=null;tStudentsView()">← 목록으로</button></div>
    <div class="card"><h2>${h(d.sid)} 학생</h2><p class="hint">처음 접속: ${h(d.first)} · 마지막 접속: ${h(d.last)}</p></div>
    <div class="card" style="border-left:8px solid #1d5a86"><h2>6차시 · 작곡가 탐구</h2>
      <dl class="summary"><dt>작곡가</dt><dd>${h(d.composer)||'-'}</dd><dt>곡</dt><dd>${h(d.piece)||'-'}</dd></dl>
      <h3 style="margin-top:16px">대화 기록</h3>
      ${d.chat6.length ? `<div class="chat side">${bubbles(d.chat6,{meLabel:'학생',time:true})}</div>` : '<p class="hint">아직 대화하지 않았어요.</p>'}
      <h3 style="margin-top:16px">핵심 키워드와 고른 이유</h3>${kw}</div>
    <div class="card" style="border-left:8px solid #9c3560"><h2>7차시 · 카툰 점검</h2>${s7}</div>`;
}

function tFeedbackView(){
  const G=T.fb;
  $('tv').innerHTML = `<div class="card"><h2>${h(T.cls)} 발표 피드백</h2>
    <p class="hint">학생에게 줄 피드백에 체크하세요. 체크는 바로 저장돼요. 출력물에는 작성자가 나오지 않아요.</p>
    <div class="btn-row"><button class="btn" onclick="printFb()">체크한 피드백 모두 PDF로 출력 (발표자별로 쪽 나눔)</button></div></div>
    ${G.length ? G.map((g,gi)=>{
      const sel=g.items.filter(x=>x.selected).length;
      return `<div class="card fbgroup"><h3>발표자 ${h(g.sid)} · ${h(g.composer)} <span class="chip">피드백 ${g.items.length}개</span> <span class="chip ok">선택 ${sel}개</span></h3>
      ${g.items.length ? `<div class="btn-row" style="margin:0 0 10px"><button class="btn sub small" onclick="tAll(${gi},true)">모두 선택</button><button class="btn sub small" onclick="tAll(${gi},false)">모두 해제</button><button class="btn small" onclick="printFb(${gi})">이 발표자만 PDF 출력</button></div>
      <div class="tablewrap"><table><thead><tr><th>선택</th><th>작성자</th><th>느낀 점</th><th>질문</th><th>작성 일시</th></tr></thead><tbody>
      ${g.items.map((x,xi)=>`<tr><td><input type="checkbox" ${x.selected?'checked':''} onchange="tSel(${gi},${xi},this)" aria-label="선택"></td>
        <td><b>${h(x.writer)}</b></td><td>${h(x.feel)}</td><td>${h(x.question)}</td><td>${h(x.at)}</td></tr>`).join('')}
      </tbody></table></div>` : '<p class="hint">아직 받은 피드백이 없어요.</p>'}</div>`;
    }).join('') : '<div class="card"><p>아직 발표자가 없어요.</p></div>'}`;
}

async function tSel(gi, xi, box){
  const g=T.fb[gi], x=g.items[xi];
  const want=box.checked; box.disabled=true;
  try{ await tapi('tSelect',{ writer:x.writer, presenter:g.sid, selected:want }); x.selected=want; }
  catch(e){ box.checked=!want; toast(errMsg(e)); }
  finally{ box.disabled=false; }
  const chips=box.closest('.fbgroup').querySelectorAll('.chip.ok');
  if(chips.length) chips[0].textContent='선택 '+g.items.filter(i=>i.selected).length+'개';
}

async function tAll(gi, on){
  const g=T.fb[gi];
  toast('저장하는 중...');
  for(const x of g.items){
    if(x.selected===on) continue;
    try{ await tapi('tSelect',{ writer:x.writer, presenter:g.sid, selected:on }); x.selected=on; }catch(e){ toast(errMsg(e)); break; }
  }
  tFeedbackView();
}

function printFb(gi){
  const groups = (gi===undefined ? T.fb : [T.fb[gi]])
    .map(g=>({ g:g, items:g.items.filter(x=>x.selected) })).filter(o=>o.items.length);
  if(!groups.length){ toast('체크한 피드백이 없어요.'); return; }
  $('printArea').innerHTML = groups.map(o=>`<section class="pp">
    <h1>발표 피드백</h1>
    <p>발표자 ${h(o.g.sid)} · 작곡가 ${h(o.g.composer)}</p>
    ${o.items.map((x,i)=>`<div class="pitem"><p><b>${i+1}. 느낀 점</b><br>${h(x.feel).replace(/\n/g,'<br>')}</p><p><b>질문</b><br>${h(x.question).replace(/\n/g,'<br>')}</p></div>`).join('')}
  </section>`).join('');
  document.body.classList.add('printing');
  const done=()=>{ document.body.classList.remove('printing'); window.removeEventListener('afterprint',done); };
  window.addEventListener('afterprint',done);
  setTimeout(()=>{ window.print(); setTimeout(done, 1500); }, 200);
}

/* =================================================================
   시작
   ================================================================= */
(function init(){
  const t=ss('tch');
  if(t && t.token){ T.token=t.token; teacherHome(); return; }
  const s=ss('stu');
  if(s && s.token){ S.token=s.token; S.sid=s.sid; S.cls=s.cls; S.tab=s.tab||6; loadStudent(); return; }
  renderLogin();
})();

document.addEventListener('keydown', e=>{
  if(e.key!=='Enter' || e.isComposing) return;
  const id=e.target && e.target.id;
  if(id==='sid'){ e.preventDefault(); checkSid(); }
  else if(id==='pin1' || id==='pin2'){ e.preventDefault(); const b=$('goPin'); if(b) b.click(); }
  else if(id==='tpw'){ e.preventDefault(); teacherLogin(); }
});
</script>
